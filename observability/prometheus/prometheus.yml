global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Métricas OpenTelemetry da API (HTTP, runtime Node, visitantes, negócio).
  - job_name: otel-collector
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # Saúde do próprio collector (spans/métricas recebidos e recusados).
  - job_name: otel-collector-internal
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: servidor

  # Recursos de cada container (CPU, memória, rede, disco, reinícios).
  - job_name: docker
    static_configs:
      - targets: ["docker-stats:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
