server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ficheiros do build com hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html aponta para os ficheiros do build actual: nunca em cache,
    # para que um deploy novo chegue logo aos visitantes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Traces do browser (OpenTelemetry) para o collector da stack de observabilidade.
    # O nome é resolvido em cada pedido pelo DNS do Docker: sem o collector a correr,
    # o nginx arranca na mesma e estes pedidos recebem 502.
    location /otel/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $otel_collector http://otel-collector:4318;
        rewrite ^/otel/(.*)$ /$1 break;
        proxy_pass $otel_collector;
        client_max_body_size 1m;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
