server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ficheiros do build com hash no nome: podem ficar em cache para sempre.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # O index.html aponta para os ficheiros do build actual: nunca em cache,
    # para que um deploy novo chegue logo aos visitantes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
