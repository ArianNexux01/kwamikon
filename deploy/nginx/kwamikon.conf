# Kwamikon Nexus: site do nginx do servidor (VPS).
# Termina o HTTPS e encaminha para os containers Docker, que só escutam em 127.0.0.1:
#   /api/      -> backend  (127.0.0.1:3333)
#   /grafana/  -> Grafana  (127.0.0.1:3000, só com docker-compose.observability.yml)
#   resto      -> frontend (127.0.0.1:8080, que encaminha /otel/ para o OpenTelemetry Collector)
# __DOMAIN__ é substituído pelo deploy/setup-server.sh.

limit_req_zone $binary_remote_addr zone=kwamikon_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=kwamikon_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=kwamikon_telemetry:10m rate=5r/s;

# WebSocket do Grafana (atualizações em direto dos dashboards).
map $http_upgrade $kwamikon_connection_upgrade {
    default upgrade;
    ''      '';
}

upstream kwamikon_backend {
    server 127.0.0.1:3333;
    keepalive 16;
}

upstream kwamikon_grafana {
    server 127.0.0.1:3000;
}

upstream kwamikon_frontend {
    server 127.0.0.1:8080;
    keepalive 16;
}

# HTTP: só serve os desafios do Let's Encrypt; tudo o resto passa para HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

# www -> domínio principal.
# O marcador HTTP2 dos blocos abaixo é substituído pelo setup-server.sh conforme a
# versão do nginx ("http2 on;" a partir da 1.25.1; nas anteriores o http2 vai no "listen").
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # __HTTP2__
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # __HTTP2__
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kwamikon_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # A câmara é usada no check-in por QR code e na moldura "Eu vou".
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/csv application/json application/javascript image/svg+xml application/manifest+json;

    client_max_body_size 1m;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Login do backoffice: limite apertado contra tentativas de adivinhar passwords.
    location = /api/auth/login {
        limit_req zone=kwamikon_login burst=5 nodelay;
        proxy_pass http://kwamikon_backend;
    }

    # Webhook da Vero Pays: sem limite, para não perder confirmações de pagamento.
    location = /api/payments/webhook {
        proxy_pass http://kwamikon_backend;
    }

    # Upload de fotografias da galeria no backoffice (até 8 MB por ficheiro).
    location = /api/gallery {
        limit_req zone=kwamikon_api burst=40 nodelay;
        client_max_body_size 9m;
        proxy_pass http://kwamikon_backend;
    }

    location /api/ {
        limit_req zone=kwamikon_api burst=40 nodelay;
        # A criação de pagamentos espera pela Vero até 30 s.
        proxy_read_timeout 60s;
        proxy_pass http://kwamikon_backend;
    }

    # Contagem de visitantes e Web Vitals enviados pelo site: limite próprio, para que
    # um abuso não consuma a quota de pedidos da API.
    location /api/analytics/ {
        limit_req zone=kwamikon_telemetry burst=20 nodelay;
        proxy_pass http://kwamikon_backend;
    }

    # Traces do browser (OpenTelemetry), encaminhados pelo nginx do frontend para o collector.
    location /otel/ {
        limit_req zone=kwamikon_telemetry burst=20 nodelay;
        proxy_pass http://kwamikon_frontend;
    }

    # Grafana: tem autenticação própria (GRAFANA_ADMIN_PASSWORD no .env da raiz).
    location /grafana/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $kwamikon_connection_upgrade;
        proxy_pass http://kwamikon_grafana;
    }

    location / {
        proxy_pass http://kwamikon_frontend;
    }
}
