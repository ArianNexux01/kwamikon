# Configuração temporária, só em HTTP, usada para emitir o primeiro certificado.
# O deploy/setup-server.sh substitui-a pela kwamikon.conf assim que o certificado existe.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 503;
    }
}
